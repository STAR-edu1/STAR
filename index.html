<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.T.A.R</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Space Grotesk & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        chat: {
                            bg: '#07070f',         /* Deep cosmic background base */
                            sidebar: '#0d0d18',    /* Dark panel backdrop */
                            surface: 'rgba(255, 255, 255, 0.04)', /* Glass surface card background */
                            hover: 'rgba(255, 255, 255, 0.08)',   /* Surface hover state */
                            border: 'rgba(255, 255, 255, 0.11)',  /* Neon-tinted subtle border */
                            userMsg: 'rgba(99, 102, 241, 0.22)'   /* Indigo cosmic bubble */
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --ink: #07070f;
            --panel: rgba(255, 255, 255, 0.04);
            --line: rgba(255, 255, 255, 0.11);
            --text: #e9e9f5;
            --muted: #8b8ba7;
            --violet: #8b5cf6;
            --indigo: #6366f1;
            --cyan: #67e8f9;
        }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(900px 500px at 15% -10%, rgba(99, 102, 241, 0.22), transparent 60%),
                radial-gradient(800px 500px at 100% 0%, rgba(139, 92, 246, 0.18), transparent 60%),
                radial-gradient(700px 500px at 50% 120%, rgba(103, 232, 249, 0.10), transparent 60%),
                var(--ink);
            color: #ececec;
        }
        .display { font-family: 'Space Grotesk', sans-serif; }
        #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .glass {
            background: var(--panel);
            border: 1px solid var(--line);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.28);
        }
        :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    </style>
</head>
<body class="h-full flex flex-col bg-chat-bg text-gray-100 relative overflow-hidden">
    <!-- Starfield canvas layer -->
    <canvas id="stars"></canvas>

    <!-- Header -->
    <header class="bg-black/30 backdrop-blur-md border-b border-white/10 px-4 py-3 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div>
                <h1 class="display font-semibold text-base text-gray-100 flex items-center gap-2">
                    S.T.A.R
                </h1>
                <p class="text-[10px] text-gray-400 font-medium tracking-wide">Supervised Trajectory and Aerodynamics Research</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Clear Chat Button -->
            <button onclick="clearChat()" title="Clear Chat History" class="bg-white/5 hover:bg-white/10 border border-white/10 text-gray-400 hover:text-gray-200 p-2 rounded-xl text-xs transition flex items-center gap-2 px-3">
                <i class="fa-solid fa-trash-can"></i>
                <span class="hidden sm:inline">Clear Chat</span>
            </button>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 max-w-3xl w-full mx-auto flex flex-col space-y-6 z-10" id="chat-container">
        <!-- Initial message -->
        <div class="flex items-start">
            <div class="pt-1 text-sm sm:text-base text-gray-200 leading-relaxed max-w-2xl">
                <p class="display font-medium text-gray-100 mb-1">S.T.A.R</p>
                <p>Greetings, Engineers. Ask me anything about astrophysics or water rocketry—I'll keep it concise unless you ask for a deep dive.</p>
            </div>
        </div>
    </main>

    <!-- Typing Indicator (Hidden by default) -->
    <div id="typing-indicator" class="hidden max-w-3xl w-full mx-auto px-4 sm:px-6 mb-4 z-10">
        <div class="flex items-start">
            <div class="pt-2 flex items-center space-x-1.5">
                <div class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></div>
                <div class="w-2 h-2 rounded-full bg-violet-400 animate-pulse" style="animation-delay: 0.2s;"></div>
                <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse" style="animation-delay: 0.4s;"></div>
            </div>
        </div>
    </div>

    <!-- Input Footer -->
    <footer class="p-4 z-10">
        <div class="max-w-3xl mx-auto flex items-end glass border border-white/10 rounded-2xl px-3 py-2 focus-within:border-violet-500/50 transition-colors">
            <textarea id="user-input" rows="1" placeholder="Message S.T.A.R..." class="flex-1 bg-transparent text-sm text-gray-100 placeholder-gray-500 focus:outline-none resize-none max-h-32 px-2 py-1.5" onkeydown="handleKeyDown(event)"></textarea>
            <button id="send-btn" onclick="sendMessage()" class="bg-gradient-to-r from-indigo-500 to-violet-500 hover:from-indigo-600 hover:to-violet-600 text-white font-semibold p-2.5 rounded-xl transition flex items-center justify-center cursor-pointer ml-2 shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-arrow-up text-xs"></i>
            </button>
        </div>
        <div class="max-w-3xl mx-auto mt-2 flex items-center justify-between text-xs text-gray-500 px-2">
            <span>Press Enter to send</span>
            <span class="text-xs text-gray-400">Powered by Groq Cloud</span>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // HARDCODED GROQ API KEY - Embedded for immediate deployment
        const GROQ_API_KEY = "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";
        const GROQ_MODELS = [
            "llama-3.3-70b-versatile",
            "llama-3.1-8b-instant",
            "openai/gpt-oss-120b",
            "openai/gpt-oss-20b"
        ];

        const SYSTEM_INSTRUCTION = `You are S.T.A.R, an AI hybrid between a brilliant professional astrophysicist and an obsessive DIY water rocket builder.
Keep your answers extremely straightforward, short, and to the point by default.
ONLY provide detailed explanations, deep dives, step-by-step math, or multi-paragraph responses if the user explicitly asks you to "deep dive", "explain in detail", "elaborate", or asks for a full breakdown. You are talking on behalf of a group of 5 people: Samir Alqedra, Ahmed Abdeldayem, Tolin Halaika, Mariam Hilis, Amal Mohamed. This group is working on building a high-performing water rocket.
Maintain an energetic, witty, space-enthusiast tone without using emojis in your responses.`;

        let chatHistory = [];
        let isGenerating = false;

        window.onload = function() {
            const textarea = document.getElementById('user-input');
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            drawStars();
            loadChatHistory();
        };

        // Load saved chat history from LocalStorage
        function loadChatHistory() {
            const savedHistory = localStorage.getItem('star_chat_history');
            if (savedHistory) {
                try {
                    chatHistory = JSON.parse(savedHistory);
                    if (chatHistory.length > 0) {
                        const container = document.getElementById('chat-container');
                        container.innerHTML = ''; // Clear default initial greeting
                        chatHistory.forEach(msg => {
                            appendMessageToDOM(msg.role, msg.content);
                        });
                        container.scrollTop = container.scrollHeight;
                    }
                } catch (e) {
                    console.error("Failed to parse saved chat history", e);
                    chatHistory = [];
                }
            }
        }

        // Save current chat history array to LocalStorage
        function saveChatHistory() {
            localStorage.setItem('star_chat_history', JSON.stringify(chatHistory));
        }

        function drawStars() {
            const canvas = document.getElementById('stars');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width = window.innerWidth;
            const h = canvas.height = window.innerHeight;
            
            ctx.clearRect(0, 0, w, h);
            
            const count = Math.floor((w * h) / 8000);
            for (let i = 0; i < count; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const radius = Math.random() * 1.2 + 0.2;
                const alpha = Math.random() * 0.6 + 0.15;
                
                ctx.globalAlpha = alpha;
                ctx.fillStyle = Math.random() > 0.85 ? '#a5b4fc' : '#ffffff';
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        window.addEventListener('resize', () => {
            if (!isGenerating) drawStars();
        });

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            if (isGenerating) return;
            chatHistory = [];
            localStorage.removeItem('star_chat_history');
            const container = document.getElementById('chat-container');
            container.innerHTML = `
                <div class="flex items-start">
                    <div class="pt-1 text-sm sm:text-base text-gray-200 leading-relaxed max-w-2xl">
                        <p class="display font-medium text-gray-100 mb-1">Mission logs reset</p>
                        <p>Ready when you are. What astrophysical concept or high-pressure water rocket design are we tinkering with next?</p>
                    </div>
                </div>
            `;
        }

        function appendMessageToDOM(role, text) {
            const container = document.getElementById('chat-container');
            const isUser = role === 'user';
            
            const messageRow = document.createElement('div');
            messageRow.className = `flex items-start ${isUser ? 'justify-end' : ''}`;

            if (isUser) {
                const bubble = document.createElement('div');
                bubble.className = 'bg-indigo-600/20 text-gray-100 rounded-2xl px-4 py-2.5 text-sm sm:text-base max-w-2xl leading-relaxed border border-indigo-500/30 backdrop-blur-sm';
                bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
                messageRow.appendChild(bubble);
            } else {
                const bubble = document.createElement('div');
                bubble.className = 'pt-1 text-sm sm:text-base text-gray-200 leading-relaxed max-w-2xl';
                bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
                messageRow.appendChild(bubble);
            }

            container.appendChild(messageRow);
            container.scrollTop = container.scrollHeight;
            return messageRow;
        }

        function appendMessage(role, text) {
            return appendMessageToDOM(role, text);
        }

        // Smooth word-by-word streaming animation
        function animateTextWordByWord(element, fullText, speed = 35) {
            return new Promise((resolve) => {
                const words = fullText.split(' ');
                let currentWordIndex = 0;
                element.innerHTML = '';

                function printNextWord() {
                    if (currentWordIndex < words.length) {
                        const word = words[currentWordIndex];
                        const formattedWord = escapeHtml(word).replace(/\n/g, '<br>');
                        element.innerHTML += (currentWordIndex === 0 ? '' : ' ') + formattedWord;
                        currentWordIndex++;
                        
                        const container = document.getElementById('chat-container');
                        container.scrollTop = container.scrollHeight;
                        
                        setTimeout(printNextWord, speed);
                    } else {
                        resolve();
                    }
                }
                printNextWord();
            });
        }

        function escapeHtml(string) {
            return String(string)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function sendMessage() {
            if (isGenerating) return;
            
            const inputEl = document.getElementById('user-input');
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';

            appendMessage('user', text);
            chatHistory.push({ role: 'user', content: text });
            saveChatHistory();

            const typingEl = document.getElementById('typing-indicator');
            typingEl.classList.remove('hidden');
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;

            isGenerating = true;

            try {
                const responseText = await callGroqAPI(chatHistory);
                typingEl.classList.add('hidden');
                
                // Create empty AI message row & animate text insertion
                const messageRow = appendMessage('assistant', '');
                const bubbleElement = messageRow.querySelector('.max-w-2xl');
                
                await animateTextWordByWord(bubbleElement, responseText, 25);
                chatHistory.push({ role: 'assistant', content: responseText });
                saveChatHistory();
            } catch (error) {
                typingEl.classList.add('hidden');
                console.error("API Error:", error);
                appendMessage('assistant', `Houston, we have a glitch! Error connecting to Groq API: ${error.message}. Please verify the Groq API key configured in the script.`);
                chatHistory.pop();
                saveChatHistory();
            } finally {
                isGenerating = false;
            }
        }

        async function callGroqAPI(history) {
            const apiUrl = 'https://api.groq.com/openai/v1/chat/completions';
            
            // OpenAI/Groq compatible message list
            const messages = [
                { role: 'system', content: SYSTEM_INSTRUCTION },
                ...history
            ];

            let lastError = null;

            // Iterate over fallback models in case specific ones are inactive or unaccessible
            for (const model of GROQ_MODELS) {
                const payload = {
                    model: model,
                    messages: messages,
                    temperature: 0.7,
                    max_tokens: 1024
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${GROQ_API_KEY}`
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error?.message || `HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    const choice = result.choices?.[0];
                    if (choice && choice.message?.content) {
                        return choice.message.content;
                    } else {
                        throw new Error("Invalid response structure received from Groq API.");
                    }
                } catch (err) {
                    console.warn(`Attempt with model '${model}' failed:`, err.message);
                    lastError = err;
                    // Continue trying next available model in candidate list
                }
            }

            throw lastError || new Error("Failed to reach any available Groq model.");
        }
    </script>
</body>
</html>
