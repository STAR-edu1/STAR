<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.T.A.R - Astrophysicist & Water Rocket Builder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        chat: {
                            bg: '#212121',         /* Main ChatGPT dark background */
                            sidebar: '#171717',    /* Sidebar / panel dark tone */
                            surface: '#2f2f2f',    /* Card & input surface background */
                            hover: '#383838',      /* Hover state background */
                            border: '#383838',     /* Subtle borders */
                            userMsg: '#303030'     /* User message bubble background */
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #212121;
            color: #ececec;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }
    </style>
</head>
<body class="h-full flex flex-col bg-chat-bg text-gray-100 relative overflow-hidden">

    <header class="bg-chat-bg border-b border-chat-border/60 px-4 py-3 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-full bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold">
                <i class="fa-solid fa-rocket text-xs"></i>
            </div>
            <div>
                <h1 class="font-semibold text-base text-gray-100 flex items-center gap-2">
                    S.T.A.R <span class="text-xs px-2 py-0.5 rounded-full bg-zinc-800 text-gray-400 border border-zinc-700 font-normal">Astrophysicist & Water Rocket Builder</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Clear Chat Button -->
            <button onclick="clearChat()" title="Clear Chat History" class="bg-zinc-800 hover:bg-chat-hover border border-chat-border text-gray-400 hover:text-gray-200 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                <i class="fa-solid fa-trash-can"></i>
                <span class="hidden sm:inline">Clear Chat</span>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 max-w-3xl w-full mx-auto flex flex-col space-y-6 z-10" id="chat-container">
        <!-- Initial welcome message -->
        <div class="flex items-start space-x-4">
            <div class="w-8 h-8 rounded-full bg-emerald-600/20 border border-emerald-500/30 flex-shrink-0 flex items-center justify-center text-emerald-400 text-xs">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            <div class="pt-1 text-sm sm:text-base text-gray-200 leading-relaxed max-w-2xl">
                <p class="font-medium text-gray-100 mb-1">S.T.A.R</p>
                <p>Greetings, Engineers. I am STAR stands for supervised trajectory and aerodynamic research, here to assist you so feel free to as about anyting.</p>
            </div>
        </div>
    </main>

    <div id="typing-indicator" class="hidden max-w-3xl w-full mx-auto px-4 sm:px-6 mb-4 z-10">
        <div class="flex items-start space-x-4">
            <div class="w-8 h-8 rounded-full bg-emerald-600/20 border border-emerald-500/30 flex-shrink-0 flex items-center justify-center text-emerald-400 text-xs">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            <div class="pt-2 flex items-center space-x-1.5">
                <div class="w-2 h-2 rounded-full bg-gray-400 animate-pulse"></div>
                <div class="w-2 h-2 rounded-full bg-gray-400 animate-pulse" style="animation-delay: 0.2s;"></div>
                <div class="w-2 h-2 rounded-full bg-gray-400 animate-pulse" style="animation-delay: 0.4s;"></div>
            </div>
        </div>
    </div>

    <footer class="bg-chat-bg p-4 z-10">
        <div class="max-w-3xl mx-auto flex items-end bg-chat-surface border border-chat-border rounded-2xl px-3 py-2 focus-within:border-zinc-500 transition-colors">
            <textarea id="user-input" rows="1" placeholder="Message S.T.A.R..." class="flex-1 bg-transparent text-sm text-gray-100 placeholder-gray-500 focus:outline-none resize-none max-h-32 px-2 py-1.5" onkeydown="handleKeyDown(event)"></textarea>
            <button id="send-btn" onclick="sendMessage()" class="bg-white hover:bg-gray-200 text-black font-semibold p-2 rounded-xl transition flex items-center justify-center cursor-pointer ml-2">
                <i class="fa-solid fa-arrow-up text-xs"></i>
            </button>
        </div>
        <div class="max-w-3xl mx-auto mt-2 flex items-center justify-between text-xs text-gray-500 px-2">
            <span>Press Enter to send</span>
            <span>Status: online</span>
        </div>
    </footer>

    <!-- Notification / Toast Container -->
    <div id="toast-container" class="fixed bottom-16 right-4 z-50 flex flex-col space-y-2"></div>

    <script>
        // Embedded Gemini API Key directly into the website
        const API_KEY = "AQ.Ab8RN6IX1cN5zE34qLApO8VoDxzLIlp4BWFitIDuuhGLjUNlJg";

        // System Instruction defining the S.T.A.R persona
        const SYSTEM_INSTRUCTION = `You are S.T.A.R, an AI hybrid between a brilliant professional astrophysicist and an obsessive DIY water rocket builder.
Keep your answers extremely straightforward, short, and to the point by default.
ONLY provide detailed explanations, deep dives, step-by-step math, or multi-paragraph responses if the user explicitly asks you to "deep dive", "explain in detail", "elaborate", or asks for a full breakdown.
Maintain an energetic, witty, space-enthusiast tone without using emojis in your responses.`;

        const STORAGE_KEY = 'star_chat_history';
        let chatHistory = [];
        let isGenerating = false;

        window.onload = function() {
            const textarea = document.getElementById('user-input');
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // Restore conversation from localStorage on load
            loadChatHistory();
        };

        function saveChatHistory() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
            } catch (e) {
                console.error("Failed to save chat history:", e);
            }
        }

        function loadChatHistory() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;

            try {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    chatHistory = parsed;
                    const container = document.getElementById('chat-container');
                    container.innerHTML = ''; // Remove static initial message if history exists
                    
                    chatHistory.forEach(msg => {
                        const text = msg.parts?.[0]?.text || '';
                        appendMessage(msg.role, text);
                    });
                }
            } catch (e) {
                console.error("Error restoring chat history:", e);
            }
        }

        function showNotification(text) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-zinc-800 border border-zinc-700 text-gray-200 text-xs px-3 py-2 rounded-lg shadow-lg transition-opacity duration-300';
            toast.innerText = text;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            if (isGenerating) return;
            chatHistory = [];
            localStorage.removeItem(STORAGE_KEY);
            
            const container = document.getElementById('chat-container');
            container.innerHTML = `
                <div class="flex items-start space-x-4">
                    <div class="w-8 h-8 rounded-full bg-emerald-600/20 border border-emerald-500/30 flex-shrink-0 flex items-center justify-center text-emerald-400 text-xs">
                        <i class="fa-solid fa-user-astronaut"></i>
                    </div>
                    <div class="pt-1 text-sm sm:text-base text-gray-200 leading-relaxed max-w-2xl">
                        <p class="font-medium text-gray-100 mb-1">Mission logs reset</p>
                        <p>Ready when you are. What astrophysical concept or high-pressure water rocket design are we tinkering with next?</p>
                    </div>
                </div>
            `;
            showNotification("Conversation cleared.");
        }

        function appendMessage(role, text) {
            const container = document.getElementById('chat-container');
            const isUser = role === 'user';
            
            const messageRow = document.createElement('div');
            messageRow.className = `flex items-start space-x-4 ${isUser ? 'justify-end' : ''}`;

            if (isUser) {
                const bubble = document.createElement('div');
                bubble.className = 'bg-chat-userMsg text-gray-100 rounded-2xl px-4 py-2.5 text-sm sm:text-base max-w-2xl leading-relaxed border border-chat-border';
                bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
                messageRow.appendChild(bubble);
            } else {
                const avatar = document.createElement('div');
                avatar.className = 'w-8 h-8 rounded-full bg-emerald-600/20 border border-emerald-500/30 flex-shrink-0 flex items-center justify-center text-emerald-400 text-xs';
                avatar.innerHTML = '<i class="fa-solid fa-user-astronaut"></i>';

                const bubble = document.createElement('div');
                bubble.className = 'pt-1 text-sm sm:text-base text-gray-200 leading-relaxed max-w-2xl';
                bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');

                messageRow.appendChild(avatar);
                messageRow.appendChild(bubble);
            }

            container.appendChild(messageRow);
            container.scrollTop = container.scrollHeight;
            return messageRow;
        }

        function animateTextWordByWord(element, fullText, speed = 30) {
            return new Promise((resolve) => {
                const words = fullText.split(' ');
                let currentWordIndex = 0;
                element.innerHTML = '';

                function printNextWord() {
                    if (currentWordIndex < words.length) {
                        const word = words[currentWordIndex];
                        const formattedWord = escapeHtml(word).replace(/\n/g, '<br>');
                        element.innerHTML += (currentWordIndex === 0 ? '' : ' ') + formattedWord;
                        currentWordIndex++;
                        
                        const container = document.getElementById('chat-container');
                        container.scrollTop = container.scrollHeight;
                        
                        setTimeout(printNextWord, speed);
                    } else {
                        resolve();
                    }
                }
                printNextWord();
            });
        }

        function escapeHtml(string) {
            return String(string)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function sendMessage() {
            if (isGenerating) return;
            
            const inputEl = document.getElementById('user-input');
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';

            appendMessage('user', text);
            chatHistory.push({ role: 'user', parts: [{ text: text }] });
            saveChatHistory();

            const typingEl = document.getElementById('typing-indicator');
            typingEl.classList.remove('hidden');
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;

            isGenerating = true;

            try {
                const responseText = await callGeminiAPI(chatHistory);
                typingEl.classList.add('hidden');
                
                // Create empty AI message row & animate text insertion
                const messageRow = appendMessage('model', '');
                const bubbleElement = messageRow.querySelector('.max-w-2xl');
                
                await animateTextWordByWord(bubbleElement, responseText, 30);
                chatHistory.push({ role: 'model', parts: [{ text: responseText }] });
                saveChatHistory();
            } catch (error) {
                typingEl.classList.add('hidden');
                console.error("API Error:", error);
                appendMessage('model', `Telemetry Error: ${error.message}. Please verify the embedded API Key in the application script.`);
                chatHistory.pop();
                saveChatHistory();
            } finally {
                isGenerating = false;
            }
        }

        async function callGeminiAPI(history) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`;
            
            const payload = {
                contents: history,
                systemInstruction: {
                    parts: [{ text: SYSTEM_INSTRUCTION }]
                }
            };

            let retries = 3;
            let delay = 1000;

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error?.message || `HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        return candidate.content.parts[0].text;
                    } else {
                        throw new Error("Invalid response structure received from Gemini API.");
                    }
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }
    </script>
</body>
</html>
